<!doctype html>
<html lang="zh-CN">
<head>
    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T19JZDS2NV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T19JZDS2NV');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {% if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {% endif %}

  <link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">

  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">

  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  {% endif %}

  {% if page.home %}
  <link
    rel="preload"
    href="{{ '/assets/images/research-desk.webp' | relative_url }}"
    as="image"
    fetchpriority="high">
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ page.schema_type | default: 'WebPage' }}",
    "name": {{ page.title | default: site.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": {{ page.canonical | default: page.url | absolute_url | jsonify }},
    "inLanguage": "zh-CN",
    "isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }}
    }
    {% if page.date_modified %},
    "dateModified": {{ page.date_modified | jsonify }}
    {% endif %}
  }
  </script>
</head>

<body class="{% if page.home %}home{% else %}article-page{% endif %}">
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="nav-shell">
      <a
        class="brand"
        href="{{ '/' | relative_url }}"
        aria-label="VPN选择与对比指南首页">
        <span class="brand-mark" aria-hidden="true">核</span>
        <span>VPN选择与对比指南</span>
      </a>

      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
        aria-label="打开导航">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/choose/how-to-choose-a-vpn/' | relative_url }}">VPN怎么选</a>
        <a href="{{ '/method/vpn-review-evidence/' | relative_url }}">评测可信度</a>
        <a href="https://www.juechenjsq.co/" rel="nofollow sponsored">绝尘加速器</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div>
      <p><strong>VPN选择与对比指南</strong></p>
      <p>帮助用户核对设备支持、价格、隐私说明和测试条件。产品功能与服务条款可能变化，购买前请查看官方当前信息。</p>
    </div>

    <a href="{{ '/method/vpn-review-evidence/' | relative_url }}">评测可信度判断</a>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
